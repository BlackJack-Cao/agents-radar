<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📡 agents-radar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
  <link rel="alternate" type="application/rss+xml" title="agents-radar RSS" href="./feed.xml">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      --bg:         #0B0D14;
      --bg-side:    #080A10;
      --bg-hover:   #12151F;
      --bg-active:  #1A1E2E;
      --border:     #1E2235;
      --text:       #C9D1D9;
      --muted:      #636E82;
      --dim:        #2E3547;
      --accent:     #E8A03D;
      --accent-bg:  rgba(232,160,61,0.10);
      --code-bg:    #0D1017;
      --link:       #79B8FF;
    }
    [data-theme="light"] {
      --bg:         #FAFBFC;
      --bg-side:    #F0F2F5;
      --bg-hover:   #E8ECF1;
      --bg-active:  #DDE3EA;
      --border:     #D2D8E0;
      --text:       #1C1E26;
      --muted:      #5A6678;
      --dim:        #B8C2D0;
      --accent:     #B57200;
      --accent-bg:  rgba(181,114,0,0.08);
      --code-bg:    #F0F2F5;
      --link:       #0451A5;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: 'Space Mono', 'Courier New', monospace;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      overflow: hidden;
    }
    body.favorites-open { overflow: hidden !important; }

    /* ── Layout ── */
    #app { display: flex; flex-direction: column; height: 100vh; }

    /* ── Header ── */
    #hdr {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; height: 50px;
      background: var(--bg-side); border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .brand { font-size: 14px; font-weight: 700; letter-spacing: -0.03em; display: flex; align-items: center; gap: 10px; }
    .brand-icon { font-size: 18px; animation: breathe 3s ease-in-out infinite; }
    @keyframes breathe { 0%,100%{opacity:1} 50%{opacity:0.55} }
    .brand em { color: var(--accent); font-style: normal; }
    .hdr-right { display: flex; align-items: center; gap: 10px; }
    .signal {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent); box-shadow: 0 0 6px var(--accent);
      animation: blink 2s ease-in-out infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.25} }
    .hdr-btn {
      background: none; border: 1px solid var(--border); color: var(--muted);
      padding: 4px 12px; border-radius: 4px; cursor: pointer;
      font-family: inherit; font-size: 10px; letter-spacing: 0.06em;
      text-decoration: none; display: inline-flex; align-items: center; gap: 5px;
      transition: border-color 0.15s, color 0.15s;
    }
    .hdr-btn:hover { border-color: var(--accent); color: var(--accent); }
    .hdr-btn.icon-only { padding: 4px 7px; }
    .hdr-btn svg { display: block; }
    #favoritesCount {
      min-width: 16px; height: 16px; padding: 0 4px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 3px; background: var(--accent-bg); color: var(--accent);
      font-size: 9px; line-height: 1;
    }
    [data-lucide] { display: none; }
    .lucide-ready .icon-fallback { display: none; }
    .lucide-ready svg.lucide { display: block; width: 14px; height: 14px; }

    /* ── Body ── */
    #body { display: flex; flex: 1; overflow: hidden; }

    /* ── Sidebar ── */
    #sidebar {
      width: 300px; flex-shrink: 0;
      background: var(--bg-side); border-right: 1px solid var(--border);
      overflow-y: auto; padding: 10px 0;
    }
    #sidebar::-webkit-scrollbar { width: 3px; }
    #sidebar::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 2px; }
    .side-label {
      font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--dim); padding: 4px 16px 10px;
    }
    .search-wrap { padding: 0 12px 10px; }
    #searchInput {
      width: 100%; height: 28px; padding: 0 9px;
      border: 1px solid var(--border); border-radius: 4px;
      background: var(--bg); color: var(--text);
      font-family: inherit; font-size: 11px;
    }
    #searchInput:focus {
      outline: none; border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--accent-bg);
    }
    #searchStatus {
      min-height: 14px; margin-top: 4px;
      font-size: 9px; letter-spacing: 0.04em; color: var(--dim);
    }
    #searchResults[hidden], #nav[hidden] { display: none; }
    .search-empty {
      padding: 18px 14px; color: var(--dim); font-size: 10px;
      line-height: 1.6; text-align: center;
    }
    .search-result {
      display: block; width: 100%; padding: 9px 14px;
      border: none; border-left: 2px solid transparent;
      background: none; color: var(--text); text-align: left;
      font-family: inherit; cursor: pointer;
      transition: background 0.12s, border-color 0.12s;
    }
    .search-result:hover, .search-result:focus-visible {
      outline: none; border-left-color: var(--accent); background: var(--bg-hover);
    }
    .search-result-meta {
      color: var(--accent); font-size: 9px; line-height: 1.4;
    }
    .search-result-section, .search-result-title, .search-result-snippet {
      overflow: hidden; overflow-wrap: anywhere;
    }
    .search-result-section {
      margin-top: 3px; color: var(--muted); font-size: 9px;
      white-space: nowrap; text-overflow: ellipsis;
    }
    .search-result-title {
      margin-top: 2px; font-size: 11px; font-weight: 700;
      display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
    }
    .search-result-snippet {
      margin-top: 3px; color: var(--muted); font-size: 9px; line-height: 1.5;
      display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3;
    }
    .search-result mark, .search-mark {
      padding: 0 2px; border-radius: 2px;
      background: rgba(232,160,61,0.28); color: inherit;
    }
    /* ── Month group ── */
    .month-hdr {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 14px; cursor: pointer;
      font-size: 12px; font-weight: 700; color: var(--dim);
      letter-spacing: 0.08em; text-transform: uppercase;
      transition: color 0.15s; user-select: none;
    }
    .month-hdr:hover { color: var(--muted); }
    .month-hdr.lit { color: var(--accent); }
    .month-body { max-height: 0; overflow: hidden; transition: max-height 0.3s ease; }
    .month-group.open .month-body { max-height: 9999px; }
    .month-group.open > .month-hdr .arr { transform: rotate(90deg); }

    .date-hdr {
      display: flex; align-items: center; justify-content: space-between;
      padding: 5px 14px 5px 22px; cursor: pointer;
      font-size: 13px; font-weight: 700; color: var(--muted);
      letter-spacing: 0.04em; transition: color 0.15s; user-select: none;
    }
    .date-hdr:hover { color: var(--text); }
    .date-hdr.lit { color: var(--accent); }
    .date-hdr.search-hit {
      color: var(--accent);
      background: linear-gradient(90deg, var(--accent-bg), transparent);
    }
    .arr { font-size: 8px; transition: transform 0.2s; display: inline-block; }
    .date-group.open .arr { transform: rotate(90deg); }
    .rpt-list { max-height: 0; overflow: hidden; transition: max-height 0.25s ease; }
    .date-group.open .rpt-list { max-height: 600px; }
    .rpt-btn {
      display: block; width: 100%; padding: 5px 14px 5px 26px;
      background: none; border: none; border-left: 2px solid transparent;
      text-align: left; cursor: pointer; font-family: inherit; font-size: 13px;
      color: var(--muted); transition: color 0.1s, background 0.1s, border-color 0.1s;
    }
    .rpt-btn:hover { background: var(--bg-hover); color: var(--text); }
    .rpt-btn.active { color: var(--accent); border-left-color: var(--accent); background: var(--accent-bg); }
    .rpt-row { display: flex; align-items: center; padding: 5px 14px 5px 26px; }
    .rpt-label { flex: 1; font-size: 13px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lang-btns { display: flex; gap: 3px; flex-shrink: 0; }
    .lang-btn {
      background: none; border: 1px solid var(--dim); color: var(--dim);
      padding: 2px 7px; border-radius: 3px; cursor: pointer;
      font-family: inherit; font-size: 11px; letter-spacing: 0.06em;
      transition: border-color 0.1s, color 0.1s;
    }
    .lang-btn:hover { border-color: var(--muted); color: var(--muted); }
    .lang-btn.active { border-color: var(--accent); color: var(--accent); background: var(--accent-bg); }

    /* ── Content ── */
    #cwrap { flex: 1; overflow-y: auto; }
    #cwrap::-webkit-scrollbar { width: 5px; }
    #cwrap::-webkit-scrollbar-thumb { background: var(--dim); border-radius: 3px; }
    #content { max-width: 820px; margin: 0 auto; padding: 36px 48px 72px; }

    .msg {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 12px;
      height: 240px; color: var(--muted); font-size: 11px; letter-spacing: 0.05em;
    }
    .msg-icon { font-size: 36px; opacity: 0.35; }

    @keyframes fadein { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:none} }
    .fade { animation: fadein 0.3s ease; }

    /* ── Markdown ── */
    .md {
      font-family: 'Source Serif 4', Georgia, 'PingFang SC', 'Microsoft YaHei', serif;
      font-size: 16px; line-height: 1.8; color: var(--text);
    }
    .md h1 { font-size: 22px; font-weight: 600; margin-bottom: 20px; line-height: 1.3; letter-spacing: -0.02em; }
    .md h2 { font-size: 17px; font-weight: 600; margin: 30px 0 12px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
    .md h3 { font-size: 15px; font-weight: 600; margin: 20px 0 8px; }
    .md h4 { font-size: 13px; font-weight: 700; margin: 16px 0 6px; color: var(--muted); font-family: 'Space Mono', monospace; letter-spacing: 0.03em; }
    .md p { margin-bottom: 12px; }
    .md a { color: var(--link); text-decoration: none; }
    .md a:hover { text-decoration: underline; }
    .md strong { font-weight: 600; }
    .md hr { border: none; border-top: 1px solid var(--border); margin: 22px 0; }
    .md ul, .md ol { padding-left: 22px; margin-bottom: 12px; }
    .md li { margin-bottom: 4px; }
    .md li > ul, .md li > ol { margin-top: 4px; margin-bottom: 0; }
    .md blockquote { border-left: 3px solid var(--accent); padding: 6px 16px; margin: 12px 0; color: var(--muted); font-style: italic; }
    .md code {
      font-family: 'Space Mono', monospace; font-size: 12.5px;
      background: var(--code-bg); border: 1px solid var(--border);
      padding: 1px 6px; border-radius: 3px;
    }
    .md pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 6px; padding: 16px; overflow-x: auto; margin: 14px 0; }
    .md pre code { background: none; border: none; padding: 0; font-size: 12px; }
    .md table { width: 100%; border-collapse: collapse; margin: 14px 0; font-size: 13px; font-family: 'Space Mono', monospace; }
    .md th { background: var(--code-bg); border: 1px solid var(--border); padding: 7px 12px; font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
    .md td { border: 1px solid var(--border); padding: 7px 12px; vertical-align: top; }
    .md tr:nth-child(even) td { background: var(--bg-hover); }
    .md details { border: 1px solid var(--border); border-radius: 6px; margin: 10px 0; overflow: hidden; }
    .md summary {
      cursor: pointer; padding: 8px 14px;
      font-family: 'Space Mono', monospace; font-size: 12px; color: var(--muted);
      background: var(--code-bg); user-select: none; list-style: none;
      display: flex; align-items: center; gap: 8px; transition: color 0.15s;
    }
    .md summary::-webkit-details-marker { display: none; }
    .md summary::before { content: '▶'; font-size: 8px; flex-shrink: 0; }
    .md details[open] summary::before { content: '▼'; }
    .md summary:hover { color: var(--text); }
    .md details > *:not(summary) { padding: 12px 14px; }
    .md .search-target {
      outline: 2px solid var(--accent); outline-offset: 5px;
      background: var(--accent-bg); transition: outline-color 0.4s, background 0.4s;
    }
    @keyframes favoriteJumpPulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(232,160,61,0.16); }
      50% { box-shadow: 0 0 0 8px rgba(232,160,61,0.22); }
    }
    .md .favorite-jump-target {
      outline: 3px solid var(--accent); outline-offset: 5px;
      background: rgba(232,160,61,0.18);
      animation: favoriteJumpPulse 1s ease-in-out 3;
      scroll-margin: 72px 0;
    }
    .md tr.favorite-jump-target td { background: rgba(232,160,61,0.18) !important; }
    @media (prefers-reduced-motion: reduce) {
      .md .favorite-jump-target { animation: none; }
    }

    /* ── Personal favorites ── */
    .favorite-target { position: relative; padding-right: 34px !important; }
    .favorite-target.favorite-summary { padding-right: 10px !important; }
    .favorite-target.favorite-table-cell { padding-right: 42px !important; }
    .favorite-btn {
      width: 26px; height: 26px; padding: 0;
      position: absolute; top: 1px; right: 0;
      display: inline-flex; align-items: center; justify-content: center;
      border: 1px solid transparent; border-radius: 4px;
      background: var(--bg); color: var(--dim); cursor: pointer; opacity: 0;
      transition: opacity 0.15s, color 0.15s, border-color 0.15s, background 0.15s;
    }
    .favorite-summary > .favorite-btn { position: static; margin-left: auto; flex-shrink: 0; }
    .favorite-table-cell > .favorite-btn { top: 5px; right: 6px; }
    .favorite-target:hover > .favorite-btn,
    .favorite-target:focus-within > .favorite-btn,
    .favorite-btn.active { opacity: 1; }
    .favorite-btn:hover, .favorite-btn:focus-visible, .favorite-btn.active {
      outline: none; color: var(--accent); border-color: var(--accent); background: var(--accent-bg);
    }
    .favorite-btn.active svg { fill: currentColor; }
    #favoritesBackdrop {
      position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,0.48);
    }
    #favoritesBackdrop[hidden], #favoritesPanel[hidden], #favoriteStatus[hidden] { display: none; }
    #favoritesPanel {
      position: fixed; z-index: 41; top: 0; right: 0; bottom: 0;
      width: min(420px, 100vw); display: flex; flex-direction: column;
      background: var(--bg-side); border-left: 1px solid var(--border);
      box-shadow: -16px 0 40px rgba(0,0,0,0.28);
    }
    .favorites-head {
      height: 52px; padding: 0 16px; display: flex; align-items: center; gap: 10px;
      border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .favorites-title { flex: 1; font-size: 13px; font-weight: 700; }
    .favorites-total { color: var(--muted); font-size: 10px; }
    .favorites-close, .favorites-reset, .favorite-record-remove {
      border: 1px solid var(--border); border-radius: 4px;
      background: none; color: var(--muted); cursor: pointer; font-family: inherit;
    }
    .favorites-close, .favorite-record-remove {
      width: 30px; height: 30px; padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .favorites-close:hover, .favorites-close:focus-visible,
    .favorite-record-remove:hover, .favorite-record-remove:focus-visible {
      outline: none; border-color: var(--accent); color: var(--accent);
    }
    #favoritesList { flex: 1; overflow-y: auto; padding: 12px; }
    .favorites-empty, .favorites-error {
      min-height: 180px; padding: 24px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
      color: var(--muted); text-align: center; font-size: 11px; line-height: 1.7;
    }
    .favorites-error { color: var(--text); }
    .favorites-reset { padding: 7px 10px; color: var(--accent); border-color: var(--accent); }
    .favorite-record {
      display: grid; grid-template-columns: minmax(0,1fr) 30px; gap: 8px;
      margin-bottom: 8px; padding: 10px; border: 1px solid var(--border);
      border-radius: 6px; background: var(--bg);
    }
    .favorite-record-main {
      min-width: 0; border: none; background: none; color: var(--text);
      text-align: left; cursor: pointer; font-family: inherit;
    }
    .favorite-record-main:focus-visible { outline: 1px solid var(--accent); outline-offset: 3px; }
    .favorite-record-meta { color: var(--accent); font-size: 9px; }
    .favorite-record-title {
      margin-top: 4px; overflow-wrap: anywhere; font-size: 11px; font-weight: 700; line-height: 1.5;
    }
    .favorite-record-snippet {
      margin-top: 4px; color: var(--muted); overflow: hidden; overflow-wrap: anywhere;
      font-family: 'Source Serif 4', Georgia, serif; font-size: 12px; line-height: 1.5;
      display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 3;
    }
    #favoriteStatus {
      position: fixed; z-index: 50; right: 18px; bottom: 18px;
      max-width: min(360px, calc(100vw - 36px)); padding: 9px 12px;
      border: 1px solid var(--border); border-radius: 4px;
      background: var(--bg-side); color: var(--text);
      box-shadow: 0 8px 24px rgba(0,0,0,0.28); font-size: 10px; line-height: 1.5;
    }
    #favoriteStatus.error { border-color: #C45454; color: #E58A8A; }

    /* ── Mobile ── */
    #mob-toggle { display: none; }
    @media (max-width: 680px) {
      #hdr { padding: 0 12px; }
      .hdr-right { gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
      .hdr-btn { padding: 4px 8px; }
      .hdr-join { display: none; }
      .hdr-icon { display: none; }
      #rssLink { display: none; }
      body { overflow: auto; }
      #app { height: auto; min-height: 100vh; }
      #body { flex-direction: column; overflow: visible; }
      #cwrap { overflow: visible; }
      #sidebar {
        width: 100%; border-right: none; border-bottom: 1px solid var(--border);
        max-height: 48px; overflow: hidden; padding: 0;
        transition: max-height 0.3s ease;
      }
      #sidebar.open { max-height: 60vh; overflow-y: auto; padding: 0 0 8px; }
      #mob-toggle {
        display: flex; align-items: center; gap: 8px;
        height: 48px; padding: 0 16px; cursor: pointer;
        font-size: 11px; color: var(--muted); border-bottom: 1px solid transparent;
        transition: color 0.15s;
      }
      #mob-toggle:hover { color: var(--text); }
      #sidebar.open #mob-toggle { border-bottom-color: var(--border); }
      .side-label { margin-top: 8px; }
      #content { padding: 20px 16px 48px; }
      .md { font-size: 15px; }
      .md table { display: block; max-width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
      .search-result { padding: 10px 16px; }
      .favorite-btn { opacity: 1; }
      #favoritesPanel { width: 100vw; }
      .favorite-record { padding: 10px 8px; }
      #favoriteStatus { right: 12px; bottom: 12px; max-width: calc(100vw - 24px); }
    }
  </style>
</head>
<body>
<div id="app">
  <div id="hdr">
    <div class="brand">
      <span class="brand-icon">📡</span>
      <span>agents-<em>radar</em></span>
    </div>
    <div class="hdr-right">
      <div class="signal"></div>
      <button id="favoritesBtn" class="hdr-btn" type="button" aria-controls="favoritesPanel" aria-expanded="false" title="我的收藏">
        <i data-lucide="star" aria-hidden="true"></i><span class="icon-fallback" aria-hidden="true">☆</span>
        <span>收藏</span><span id="favoritesCount">0</span>
      </button>
      <a id="rssLink" class="hdr-btn" href="./feed.xml" title="RSS Feed"><span class="hdr-icon">⊕</span>RSS</a>
      <button id="themeBtn" class="hdr-btn"><span class="hdr-icon">◐</span><span class="hdr-label">LIGHT</span></button>
    </div>
  </div>

  <div id="body">
    <div id="sidebar">
      <div id="mob-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">
        ☰ &nbsp;选择报告
      </div>
      <div class="side-label">REPORTS</div>
      <div class="search-wrap">
        <input id="searchInput" type="search" placeholder="搜索全文，如 Claude">
        <div id="searchStatus"></div>
      </div>
      <div id="searchResults" hidden></div>
      <div id="nav"></div>
    </div>

    <div id="cwrap">
      <div id="content">
        <div class="msg"><div class="msg-icon">📡</div><div>正在加载…</div></div>
      </div>
    </div>
  </div>
</div>

<div id="favoritesBackdrop" hidden></div>
<aside id="favoritesPanel" role="dialog" aria-modal="true" aria-labelledby="favoritesTitle" hidden>
  <div class="favorites-head">
    <div id="favoritesTitle" class="favorites-title">我的收藏</div>
    <div id="favoritesTotal" class="favorites-total">0 条</div>
    <button id="favoritesClose" class="favorites-close" type="button" aria-label="关闭收藏列表">
      <i data-lucide="x" aria-hidden="true"></i><span class="icon-fallback" aria-hidden="true">×</span>
    </button>
  </div>
  <div id="favoritesList"></div>
</aside>
<div id="favoriteStatus" role="status" aria-live="polite" hidden></div>

<script type="module">
import {
  chooseTargetIndex,
  hydrateSearchIndex,
  makeSearchSnippet,
  searchEntries as findSearchEntries,
} from './assets/search.js';
import {
  FAVORITES_STORAGE_KEY,
  createEmptyFavoriteState,
  createFavoriteItemId,
  isFavorite,
  listFavorites,
  parseFavoriteState,
  toggleFavorite,
} from './assets/favorites.js';

const { marked, DOMPurify } = window;
marked.use({ breaks: true, gfm: true });

// Allow <details> and <summary> which DOMPurify strips by default
DOMPurify.addHook('uponSanitizeElement', (node, data) => {
  if (data.tagName === 'details' || data.tagName === 'summary') {
    data.allowedTags[data.tagName] = true;
  }
});

function renderMarkdown(raw) {
  const html = marked.parse(raw);
  return DOMPurify.sanitize(html, {
    ADD_TAGS: ['details', 'summary'],
    ADD_ATTR: ['open'],
  });
}

const LABELS = {
  'ai-cli':          'AI CLI 工具',
  'ai-cli-en':       'AI CLI Tools',
  'ai-agents':       'AI Agents 生态',
  'ai-agents-en':    'AI Agents Ecosystem',
  'ai-web':          'OpenAI & Anthropic 官网动态',
  'ai-web-en':       'OpenAI & Anthropic Updates',
  'ai-trending':     'GitHub AI 趋势',
  'ai-trending-en':  'GitHub AI Trends',
  'ai-hn':           'HN 社区动态',
  'ai-hn-en':        'HN Community Digest',
  'ai-ph':           'Product Hunt AI',
  'ai-ph-en':        'Product Hunt AI',
  'ai-arxiv':        'ArXiv AI 研究',
  'ai-arxiv-en':     'ArXiv AI Research',
  'ai-hf':           'HF 热门模型',
  'ai-hf-en':        'HF Trending Models',
  'ai-medical':      '医疗 AI',
  'ai-medical-en':   'Medical AI',
  'ai-community':    '技术社区 AI',
  'ai-community-en': 'Tech Community AI',
  'ai-weekly':       'AI 周报',
  'ai-weekly-en':    'AI Weekly',
  'ai-monthly':      'AI 月报',
  'ai-monthly-en':   'AI Monthly',
};

// ── Theme ──
const htmlEl = document.documentElement;
const themeBtn = document.getElementById('themeBtn');
let theme = localStorage.getItem('ar-theme') || 'dark';

const themeIcon = themeBtn.querySelector('.hdr-icon');
const themeLabel = themeBtn.querySelector('.hdr-label');

function applyTheme(t) {
  theme = t;
  htmlEl.dataset.theme = t;
  themeIcon.textContent = t === 'dark' ? '◐' : '●';
  themeLabel.textContent = t === 'dark' ? 'LIGHT' : 'DARK';
  localStorage.setItem('ar-theme', t);
}
applyTheme(theme);
themeBtn.onclick = () => applyTheme(theme === 'dark' ? 'light' : 'dark');

// ── Routing ──
function getHash() {
  const [date, report] = location.hash.slice(1).split('/');
  return /^\d{4}-\d{2}-\d{2}$/.test(date) && report ? { date, report } : null;
}

// ── State ──
let currentKey = null;
let searchIndex = [];
let searchReady = false;
let searchUnavailable = false;
let searchQuery = '';
let searchDebounce = null;
let favoriteState = createEmptyFavoriteState();
let favoriteStorageError = null;
let favoriteStatusTimer = null;
let favoritePreviousFocus = null;
let targetHighlightTimer = null;
const reportCache = new Map();

const searchInput = document.getElementById('searchInput');
const searchStatus = document.getElementById('searchStatus');
const searchResults = document.getElementById('searchResults');
const nav = document.getElementById('nav');
const favoritesBtn = document.getElementById('favoritesBtn');
const favoritesCount = document.getElementById('favoritesCount');
const favoritesBackdrop = document.getElementById('favoritesBackdrop');
const favoritesPanel = document.getElementById('favoritesPanel');
const favoritesClose = document.getElementById('favoritesClose');
const favoritesTotal = document.getElementById('favoritesTotal');
const favoritesList = document.getElementById('favoritesList');
const favoriteStatus = document.getElementById('favoriteStatus');

function refreshIcons() {
  if (!window.lucide?.createIcons) return;
  window.lucide.createIcons({ attrs: { 'stroke-width': 1.8, 'aria-hidden': 'true' } });
  htmlEl.classList.add('lucide-ready');
}

function truncateText(value, maxLength) {
  const chars = Array.from(String(value ?? ''));
  return chars.length <= maxLength ? chars.join('') : `${chars.slice(0, maxLength - 1).join('')}…`;
}

function showFavoriteStatus(message, type = 'info') {
  clearTimeout(favoriteStatusTimer);
  favoriteStatus.textContent = message;
  favoriteStatus.classList.toggle('error', type === 'error');
  favoriteStatus.hidden = false;
  favoriteStatusTimer = window.setTimeout(() => { favoriteStatus.hidden = true; }, 3200);
}

function updateFavoriteButtons() {
  document.querySelectorAll('.favorite-btn[data-item-id]').forEach(button => {
    const active = isFavorite(favoriteState, button.dataset.itemId);
    button.classList.toggle('active', active);
    button.setAttribute('aria-pressed', String(active));
    button.setAttribute('aria-label', active ? '取消收藏此条目' : '收藏此条目');
    button.title = active ? '取消收藏' : '收藏';
  });
}

function closeFavoritesPanel() {
  favoritesPanel.hidden = true;
  favoritesBackdrop.hidden = true;
  favoritesBtn.setAttribute('aria-expanded', 'false');
  document.body.classList.remove('favorites-open');
  favoritePreviousFocus?.focus?.();
  favoritePreviousFocus = null;
}

function removeFavorite(item) {
  const nextState = toggleFavorite(favoriteState, item);
  if (persistFavoriteState(nextState)) showFavoriteStatus('已取消收藏');
}

function renderFavoritesPanel() {
  favoritesList.replaceChildren();
  const favorites = listFavorites(favoriteState);
  favoritesTotal.textContent = `${favorites.length} 条`;

  if (favoriteStorageError) {
    const error = document.createElement('div');
    error.className = 'favorites-error';
    const message = document.createElement('div');
    message.textContent = `本地收藏无法读取：${favoriteStorageError}`;
    const reset = document.createElement('button');
    reset.type = 'button';
    reset.className = 'favorites-reset';
    reset.textContent = '重置本地收藏';
    reset.onclick = resetFavoriteStorage;
    error.append(message, reset);
    favoritesList.appendChild(error);
    return;
  }

  if (!favorites.length) {
    const empty = document.createElement('div');
    empty.className = 'favorites-empty';
    empty.innerHTML = '<span aria-hidden="true">☆</span><span>还没有收藏条目</span>';
    favoritesList.appendChild(empty);
    return;
  }

  for (const item of favorites) {
    const record = document.createElement('div');
    record.className = 'favorite-record';
    const main = document.createElement('button');
    main.type = 'button';
    main.className = 'favorite-record-main';
    const meta = document.createElement('div');
    meta.className = 'favorite-record-meta';
    meta.textContent = `${item.date} · ${LABELS[item.report] || item.report}`;
    const title = document.createElement('div');
    title.className = 'favorite-record-title';
    title.textContent = item.title;
    const snippet = document.createElement('div');
    snippet.className = 'favorite-record-snippet';
    snippet.textContent = item.snippet;
    main.append(meta, title, snippet);
    main.onclick = () => {
      closeFavoritesPanel();
      loadReport(item.date, item.report, true, {
        itemId: item.id,
        anchorText: item.anchorText,
        query: item.title,
        missingMessage: '条目内容可能已更新，已打开原报告',
      });
    };

    const remove = document.createElement('button');
    remove.type = 'button';
    remove.className = 'favorite-record-remove';
    remove.setAttribute('aria-label', `取消收藏 ${item.title}`);
    remove.title = '取消收藏';
    remove.innerHTML = '<i data-lucide="trash-2" aria-hidden="true"></i><span class="icon-fallback" aria-hidden="true">×</span>';
    remove.onclick = () => removeFavorite(item);
    record.append(main, remove);
    favoritesList.appendChild(record);
  }
  refreshIcons();
}

function updateFavoritesUi() {
  favoritesCount.textContent = String(listFavorites(favoriteState).length);
  updateFavoriteButtons();
  renderFavoritesPanel();
}

function loadFavoriteStorage(raw = undefined) {
  try {
    favoriteState = parseFavoriteState(raw === undefined ? localStorage.getItem(FAVORITES_STORAGE_KEY) : raw);
    favoriteStorageError = null;
  } catch (error) {
    favoriteState = createEmptyFavoriteState();
    favoriteStorageError = error instanceof Error ? error.message : String(error);
  }
  updateFavoritesUi();
}

function persistFavoriteState(nextState) {
  if (favoriteStorageError) {
    showFavoriteStatus('请先在“我的收藏”中重置损坏的本地数据', 'error');
    openFavoritesPanel();
    return false;
  }
  try {
    localStorage.setItem(FAVORITES_STORAGE_KEY, JSON.stringify(nextState));
    favoriteState = nextState;
    updateFavoritesUi();
    return true;
  } catch (error) {
    console.error('Favorite storage write failed:', error);
    showFavoriteStatus('收藏保存失败，请检查浏览器存储权限', 'error');
    return false;
  }
}

function resetFavoriteStorage() {
  const empty = createEmptyFavoriteState();
  try {
    localStorage.setItem(FAVORITES_STORAGE_KEY, JSON.stringify(empty));
    favoriteState = empty;
    favoriteStorageError = null;
    updateFavoritesUi();
    showFavoriteStatus('本地收藏已重置');
  } catch (error) {
    console.error('Favorite storage reset failed:', error);
    showFavoriteStatus('无法重置收藏，请检查浏览器存储权限', 'error');
  }
}

function openFavoritesPanel() {
  favoritePreviousFocus = document.activeElement;
  favoritesBackdrop.hidden = false;
  favoritesPanel.hidden = false;
  favoritesBtn.setAttribute('aria-expanded', 'true');
  document.body.classList.add('favorites-open');
  renderFavoritesPanel();
  favoritesClose.focus();
}

function itemText(element) {
  const clone = element.cloneNode(true);
  clone.querySelectorAll?.('.favorite-btn').forEach(button => button.remove());
  return String(clone.textContent || '').replace(/\s+/g, ' ').trim();
}

function isAfterFirstSection(element, root) {
  const firstSection = root.querySelector('h2');
  return !firstSection || !!(firstSection.compareDocumentPosition(element) & Node.DOCUMENT_POSITION_FOLLOWING);
}

function isFavoriteCandidate(element, root) {
  if (!isAfterFirstSection(element, root)) return false;
  const details = element.closest('details');
  if (details && !element.matches('summary')) return false;
  if (element.matches('li') && element.parentElement?.closest('li')) return false;
  if (element.matches('p') && element.parentElement !== root) return false;
  const text = itemText(element);
  if (text.length < 8) return false;
  return !/本(日报|报告)由.+自动生成|本报告基于.+仅供参考|automatically generated/i.test(text);
}

function favoriteTitle(element, text) {
  if (element.matches('tr')) return truncateText(element.cells?.[0]?.textContent || text, 90);
  const emphasized = element.querySelector('strong, a');
  return truncateText(emphasized?.textContent || text, 90);
}

function toggleFavoriteItem(item) {
  if (favoriteStorageError) {
    showFavoriteStatus('本地收藏数据已损坏，请先重置', 'error');
    openFavoritesPanel();
    return;
  }
  const adding = !isFavorite(favoriteState, item.id);
  const nextState = toggleFavorite(favoriteState, item);
  if (persistFavoriteState(nextState)) showFavoriteStatus(adding ? '已收藏' : '已取消收藏');
}

function enhanceFavoriteItems(date, report) {
  const root = document.querySelector('.md');
  if (!root) return;
  const occurrences = new Map();
  const candidates = Array.from(root.querySelectorAll('p, li, summary, tbody > tr'))
    .filter(element => isFavoriteCandidate(element, root));

  for (const element of candidates) {
    const text = itemText(element);
    const occurrenceKey = text.normalize('NFKC').replace(/\s+/g, ' ').trim().toLocaleLowerCase();
    const occurrence = occurrences.get(occurrenceKey) || 0;
    occurrences.set(occurrenceKey, occurrence + 1);
    const item = {
      id: createFavoriteItemId(date, report, text, occurrence),
      date,
      report,
      title: favoriteTitle(element, text),
      anchorText: truncateText(text, 160),
      snippet: truncateText(text, 180),
    };

    let container = element;
    if (element.matches('tr')) {
      container = element.lastElementChild;
      if (!container) continue;
      container.classList.add('favorite-table-cell');
    } else if (element.matches('summary')) {
      container.classList.add('favorite-summary');
    }
    container.classList.add('favorite-target');
    element.dataset.favoriteId = item.id;

    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'favorite-btn';
    button.dataset.itemId = item.id;
    button.innerHTML = '<i data-lucide="star" aria-hidden="true"></i><span class="icon-fallback" aria-hidden="true">☆</span>';
    button.onclick = event => {
      event.preventDefault();
      event.stopPropagation();
      toggleFavoriteItem(item);
    };
    container.appendChild(button);
  }
  updateFavoriteButtons();
  refreshIcons();
}

favoritesBtn.onclick = openFavoritesPanel;
favoritesClose.onclick = closeFavoritesPanel;
favoritesBackdrop.onclick = closeFavoritesPanel;
document.addEventListener('keydown', event => {
  if (event.key === 'Escape' && !favoritesPanel.hidden) closeFavoritesPanel();
});
window.addEventListener('storage', event => {
  if (event.key !== FAVORITES_STORAGE_KEY) return;
  loadFavoriteStorage(event.newValue);
  showFavoriteStatus('收藏已在其他标签页更新');
});
loadFavoriteStorage();
refreshIcons();

function setSearchStatus(text) {
  searchStatus.textContent = text || '';
}

function appendHighlightedText(container, text, query) {
  const needle = query.trim().toLocaleLowerCase();
  if (!needle) {
    container.textContent = text;
    return;
  }

  const lower = text.toLocaleLowerCase();
  let cursor = 0;
  let matchAt = lower.indexOf(needle);
  if (matchAt < 0) {
    container.textContent = text;
    return;
  }

  while (matchAt >= 0) {
    if (matchAt > cursor) container.appendChild(document.createTextNode(text.slice(cursor, matchAt)));
    const mark = document.createElement('mark');
    mark.textContent = text.slice(matchAt, matchAt + needle.length);
    container.appendChild(mark);
    cursor = matchAt + needle.length;
    matchAt = lower.indexOf(needle, cursor);
  }
  if (cursor < text.length) container.appendChild(document.createTextNode(text.slice(cursor)));
}

function renderSearchEmpty(message) {
  const empty = document.createElement('div');
  empty.className = 'search-empty';
  empty.textContent = message;
  searchResults.replaceChildren(empty);
}

function renderSearchResults(query) {
  searchQuery = query;
  const hasQuery = !!query.trim();
  nav.hidden = hasQuery;
  searchResults.hidden = !hasQuery;

  if (!hasQuery) {
    setSearchStatus(searchUnavailable ? '搜索索引暂不可用' : '');
    searchResults.replaceChildren();
    return;
  }
  if (searchUnavailable) {
    setSearchStatus('搜索索引暂不可用');
    renderSearchEmpty('报告仍可通过日期目录正常浏览');
    return;
  }
  if (!searchReady) {
    setSearchStatus('搜索索引加载中…');
    renderSearchEmpty('正在准备搜索结果');
    return;
  }

  const result = findSearchEntries(searchIndex, query, 50);
  const suffix = result.total > result.items.length ? `，显示前 ${result.items.length} 条` : '';
  setSearchStatus(`匹配 ${result.total} 条，涉及 ${result.days} 天${suffix}`);
  searchResults.replaceChildren();
  if (!result.items.length) {
    renderSearchEmpty('没有找到匹配内容');
    return;
  }

  for (const entry of result.items) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'search-result';

    const meta = document.createElement('div');
    meta.className = 'search-result-meta';
    meta.textContent = `${entry.date} · ${LABELS[entry.report] || entry.report}`;

    const section = document.createElement('div');
    section.className = 'search-result-section';
    section.textContent = entry.section || '报告正文';

    const title = document.createElement('div');
    title.className = 'search-result-title';
    appendHighlightedText(title, entry.title, query);

    const snippet = document.createElement('div');
    snippet.className = 'search-result-snippet';
    appendHighlightedText(snippet, makeSearchSnippet(entry.text, query), query);

    button.append(meta, section, title, snippet);
    button.onclick = () =>
      loadReport(entry.date, entry.report, true, { anchorText: entry.anchorText, query });
    searchResults.appendChild(button);
  }
}

async function initSearch() {
  searchReady = false;
  searchUnavailable = false;
  setSearchStatus('搜索索引加载中…');
  try {
    const res = await fetch('./search-index.json');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    searchIndex = hydrateSearchIndex(await res.json());
    searchReady = true;
    setSearchStatus('');
    renderSearchResults(searchQuery);
  } catch (error) {
    console.error('Search index unavailable:', error);
    searchUnavailable = true;
    setSearchStatus('搜索索引暂不可用');
    renderSearchResults(searchQuery);
  }
}

searchInput.addEventListener('input', () => {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(() => renderSearchResults(searchInput.value), 120);
});

function setContent(html) {
  document.getElementById('content').innerHTML = html;
}

function clearSearchTarget() {
  const root = document.querySelector('.md');
  if (!root) return;
  clearTimeout(targetHighlightTimer);
  root.querySelectorAll('.search-target, .favorite-jump-target').forEach(element => {
    element.classList.remove('search-target', 'favorite-jump-target');
  });
  root.querySelectorAll('mark.search-mark').forEach((mark) => {
    mark.replaceWith(document.createTextNode(mark.textContent || ''));
  });
  root.normalize();
}

function highlightTargetText(element, query) {
  const needle = query.trim().toLocaleLowerCase();
  if (!needle) return;
  const walker = document.createTreeWalker(element, NodeFilter.SHOW_TEXT);
  const nodes = [];
  let node = walker.nextNode();
  while (node) {
    if (!node.parentElement?.closest('mark, script, style')) nodes.push(node);
    node = walker.nextNode();
  }

  for (const textNode of nodes) {
    const text = textNode.nodeValue || '';
    const lower = text.toLocaleLowerCase();
    let cursor = 0;
    let matchAt = lower.indexOf(needle);
    if (matchAt < 0) continue;

    const fragment = document.createDocumentFragment();
    while (matchAt >= 0) {
      if (matchAt > cursor) fragment.appendChild(document.createTextNode(text.slice(cursor, matchAt)));
      const mark = document.createElement('mark');
      mark.className = 'search-mark';
      mark.textContent = text.slice(matchAt, matchAt + needle.length);
      fragment.appendChild(mark);
      cursor = matchAt + needle.length;
      matchAt = lower.indexOf(needle, cursor);
    }
    if (cursor < text.length) fragment.appendChild(document.createTextNode(text.slice(cursor)));
    textNode.replaceWith(fragment);
  }
}

function locateSearchTarget(target) {
  const root = document.querySelector('.md');
  if (!root || !target) return false;
  clearSearchTarget();

  const candidates = Array.from(
    root.querySelectorAll('h1, h2, h3, h4, h5, h6, p, li, tr, summary, blockquote'),
  );
  let element = target.itemId
    ? candidates.find(candidate => candidate.dataset.favoriteId === target.itemId)
    : null;
  if (!element) {
    const index = chooseTargetIndex(
      candidates.map(candidate => candidate.textContent || ''),
      target.anchorText,
      target.query,
    );
    if (index < 0) return false;
    element = candidates[index];
  }

  const details = element.closest('details');
  if (details) details.open = true;
  highlightTargetText(element, target.query);
  const targetClass = target.itemId ? 'favorite-jump-target' : 'search-target';
  element.classList.add(targetClass);
  const scrollDelay = window.matchMedia('(max-width: 680px)').matches ? 350 : 0;
  window.setTimeout(() => element.scrollIntoView({ behavior: 'smooth', block: 'center' }), scrollDelay);
  targetHighlightTimer = window.setTimeout(
    () => element.classList.remove(targetClass),
    target.itemId ? 4200 : 2400,
  );
  return true;
}

async function loadReport(date, report, push = true, target = null) {
  const key = `${date}/${report}`;
  if (key === currentKey) {
    document.getElementById('sidebar').classList.remove('open');
    if (target) {
      const found = locateSearchTarget(target);
      if (!found && target.missingMessage) showFavoriteStatus(target.missingMessage, 'error');
    }
    return true;
  }
  currentKey = key;

  if (push) history.pushState(null, '', `#${key}`);

  // Sync sidebar
  document.querySelectorAll('.rpt-btn').forEach(b => b.classList.toggle('active', b.dataset.key === key));
  document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.key === key));
  document.querySelectorAll('.date-hdr').forEach(h => {
    const grp = h.closest('.date-group');
    const hasActive = grp.querySelector('.rpt-btn.active') || grp.querySelector('.lang-btn.active');
    h.classList.toggle('lit', !!hasActive);
  });
  document.querySelectorAll('.month-hdr').forEach(h => {
    const mGrp = h.closest('.month-group');
    const hasActive = mGrp.querySelector('.lang-btn.active') || mGrp.querySelector('.rpt-btn.active');
    h.classList.toggle('lit', !!hasActive);
  });
  document.querySelectorAll('.date-group').forEach(g => {
    if (g.dataset.date === date) {
      g.classList.add('open');
      // Also open parent month group
      const monthGrp = g.closest('.month-group');
      if (monthGrp) monthGrp.classList.add('open');
    }
  });

  // Close mobile sidebar
  document.getElementById('sidebar').classList.remove('open');

  const cwrap = document.getElementById('cwrap');
  setContent('<div class="msg"><div class="msg-icon">⏳</div><div>Loading…</div></div>');
  cwrap.scrollTop = 0;

  try {
    let raw = reportCache.get(key);
    if (raw === undefined) {
      const res = await fetch(`./digests/${date}/${report}.md`);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      raw = await res.text();
      reportCache.set(key, raw);
    }
    const safe = renderMarkdown(raw);
    setContent(`<div class="md fade">${safe}</div>`);
    enhanceFavoriteItems(date, report);
    if (target) {
      const found = locateSearchTarget(target);
      if (!found && target.missingMessage) showFavoriteStatus(target.missingMessage, 'error');
    }
    return true;
  } catch (e) {
    setContent(`<div class="msg"><div class="msg-icon">⚠️</div><div>加载失败：${e.message}</div></div>`);
    return false;
  }
}

function buildDateGroup(date, reports, isFirst) {
  const grp = document.createElement('div');
  grp.className = 'date-group' + (isFirst ? ' open' : '');
  grp.dataset.date = date;

  const hdr = document.createElement('div');
  hdr.className = 'date-hdr';
  // Show only the day part (DD) since month is already in the parent header
  const dayLabel = date.slice(8); // "03" from "2026-04-03"
  const dateText = document.createTextNode(dayLabel + '\u00a0');
  const arrSpan = document.createElement('span');
  arrSpan.className = 'arr';
  arrSpan.textContent = '▶';
  hdr.appendChild(dateText);
  hdr.appendChild(arrSpan);
  hdr.onclick = () => grp.classList.toggle('open');

  const list = document.createElement('div');
  list.className = 'rpt-list';

  const baseReports = reports.filter(r => !r.endsWith('-en'));
  baseReports.forEach(r => {
    const enKey = r + '-en';
    const hasEn = reports.includes(enKey);

    if (hasEn) {
      const row = document.createElement('div');
      row.className = 'rpt-row';

      const label = document.createElement('span');
      label.className = 'rpt-label';
      const baseLabel = LABELS[r] || r;
      label.textContent = baseLabel;
      label.title = baseLabel;

      const btns = document.createElement('div');
      btns.className = 'lang-btns';

      const zhBtn = document.createElement('button');
      zhBtn.className = 'lang-btn';
      zhBtn.dataset.key = `${date}/${r}`;
      zhBtn.textContent = 'ZH';
      zhBtn.onclick = () => loadReport(date, r);

      const enBtn = document.createElement('button');
      enBtn.className = 'lang-btn';
      enBtn.dataset.key = `${date}/${enKey}`;
      enBtn.textContent = 'EN';
      enBtn.onclick = () => loadReport(date, enKey);

      btns.append(zhBtn, enBtn);
      row.append(label, btns);
      list.appendChild(row);
    } else {
      const btn = document.createElement('button');
      btn.className = 'rpt-btn';
      btn.dataset.key = `${date}/${r}`;
      btn.textContent = LABELS[r] || r;
      btn.onclick = () => loadReport(date, r);
      list.appendChild(btn);
    }
  });

  grp.append(hdr, list);
  return grp;
}

function buildNav(dates) {
  const nav = document.getElementById('nav');

  // Group dates by month (YYYY-MM)
  const months = new Map();
  dates.forEach((entry) => {
    const month = entry.date.slice(0, 7); // "2026-04"
    if (!months.has(month)) months.set(month, []);
    months.get(month).push(entry);
  });

  let isFirstDate = true;
  let isFirstMonth = true;
  months.forEach((entries, month) => {
    const mGrp = document.createElement('div');
    mGrp.className = 'month-group' + (isFirstMonth ? ' open' : '');

    const mHdr = document.createElement('div');
    mHdr.className = 'month-hdr';
    const mText = document.createTextNode(month + '\u00a0');
    const mArr = document.createElement('span');
    mArr.className = 'arr';
    mArr.textContent = '▶';
    mHdr.appendChild(mText);
    mHdr.appendChild(mArr);
    mHdr.onclick = () => mGrp.classList.toggle('open');

    const mBody = document.createElement('div');
    mBody.className = 'month-body';

    entries.forEach(({ date, reports }) => {
      mBody.appendChild(buildDateGroup(date, reports, isFirstDate));
      isFirstDate = false;
    });

    mGrp.append(mHdr, mBody);
    nav.appendChild(mGrp);
    isFirstMonth = false;
  });
}

window.addEventListener('popstate', () => {
  const h = getHash();
  if (h) loadReport(h.date, h.report, false);
});

// ── Init ──
(async () => {
  try {
    const res = await fetch('./manifest.json');
    if (!res.ok) throw new Error('manifest.json not found');
    const { dates } = await res.json();
    if (!dates?.length) throw new Error('manifest is empty');

    buildNav(dates);
    initSearch();

    const hash = getHash();
    const first = dates[0];
    if (hash && dates.find(d => d.date === hash.date && d.reports.includes(hash.report))) {
      loadReport(hash.date, hash.report, false);
    } else if (first?.reports?.length) {
      const r0 = first.reports[0];
      history.replaceState(null, '', `#${first.date}/${r0}`);
      loadReport(first.date, r0, false);
    }
  } catch (e) {
    document.getElementById('nav').innerHTML =
      '<div class="msg" style="height:80px;font-size:10px">⚠️ ' + e.message + '</div>';
    setContent('<div class="msg"><div class="msg-icon">📡</div><div>无法加载 manifest.json</div></div>');
  }
})();
</script>
